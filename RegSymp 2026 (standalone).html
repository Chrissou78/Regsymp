document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

x-sizing: border-box; }\n\nhtml { scroll-behavior: smooth; }\n\nbody {\n  margin: 0;\n  font-family: var(--sans);\n  font-size: 16px;\n  line-height: 1.6;\n  color: var(--text-dark);\n  background: var(--white);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nimg { max-width: 100%; display: block; }\na { color: inherit; text-decoration: none; }\n\n:focus-visible {\n  outline: 3px solid #8B9BB4;\n  outline-offset: 3px;\n  border-radius: 3px;\n}\n\n.skip-link {\n  position: absolute; top: -100%; left: 16px;\n  background: #1C2B4A; color: white;\n  padding: 8px 16px; border-radius: 0 0 8px 8px;\n  font-size: 14px; font-weight: 600; z-index: 10001;\n}\n.skip-link:focus { top: 0; }\n\n@media (prefers-reduced-motion: reduce) {\n  .marquee-track { animation: none; }\n  .hero-video { display: none; }\n  .reveal { transition: none; opacity: 1; transform: none; }\n}\n\nbutton { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }\n\n/* ------- Typography ------- */\n.eyebrow {\n  font-family: var(--sans);\n  font-size: 10px;\n  font-weight: 600;\n  letter-spacing: 0.22em;\n  text-transform: uppercase;\n  color: var(--blue);\n  display: inline-block;\n  margin: 0 0 20px;\n}\n.eyebrow.on-dark { color: var(--blue-light); }\n\nh1, h2, h3, h4 { margin: 0; font-weight: 500; letter-spacing: -0.01em; line-height: 1.1; }\n\n.h-display {\n  font-family: var(--display);\n  font-weight: 400;\n  font-size: clamp(40px, 6.4vw, 88px);\n  line-height: 1.06;\n  letter-spacing: 0.01em;\n}\n.h2 {\n  font-family: var(--serif);\n  font-weight: 400;\n  font-size: clamp(32px, 4.2vw, 52px);\n  line-height: 1.08;\n  letter-spacing: -0.015em;\n}\n.h3 {\n  font-family: var(--sans);\n  font-weight: 500;\n  font-size: clamp(20px, 2vw, 26px);\n  letter-spacing: -0.01em;\n}\n.h4 {\n  font-family: var(--sans);\n  font-weight: 500;\n  font-size: 17px;\n}\n\n.lede { font-size: clamp(15px, 1.2vw, 17px); line-height: 1.72; color: var(--text-muted); max-width: 62ch; }\n.on-dark .lede, .lede.on-dark { color: rgba(246,242,235,0.58); }\n\n/* ------- Layout ------- */\n.container { max-width: var(--maxw); margin: 0 auto; padding-left: var(--gutter); padding-right: var(--gutter); }\n\nsection.section { padding-top: var(--section-py); padding-bottom: var(--section-py); position: relative; }\n.section.dark      { background: var(--navy);      color: var(--white); }\n.section.dark-deep { background: var(--navy-deep); color: var(--white); }\n.section.light     { background: var(--off-white);  color: var(--text-dark); }\n\n.section.dark h1, .section.dark h2, .section.dark h3, .section.dark h4 { color: var(--white); }\n\n.section-head { max-width: 760px; margin-bottom: clamp(48px, 6vw, 80px); }\n.section-head .h2 { margin-bottom: 18px; }\n\n/* ------- Buttons ------- */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 12px;\n  padding: 15px 28px;\n  font-size: 11px;\n  font-weight: 600;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  border-radius: 0;\n  transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease, border-color 0.2s ease;\n  white-space: nowrap;\n  position: relative;\n}\n.btn .arrow { transition: transform 0.25s ease; }\n.btn:hover .arrow { transform: translateX(4px); }\n\n.btn-primary { background: var(--navy); color: var(--white); }\n.btn-primary:hover { background: var(--navy-deep); }\n.btn-primary.on-light { background: var(--navy-deep); }\n.btn-primary.on-light:hover { background: var(--navy); }\n\n.btn-ghost {\n  color: var(--white);\n  border: 1px solid rgba(255,255,255,0.22);\n  background: transparent;\n}\n.btn-ghost:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.4); }\n\n.btn-link {\n  font-size: 12px;\n  font-weight: 600;\n  letter-spacing: 0.06em;\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  padding-bottom: 2px;\n  border-bottom: 1px solid currentColor;\n  color: inherit;\n}\n.btn-link:hover { color: var(--blue-light); }\n\n/* ------- Navigation ------- */\n.nav {\n  position: fixed; top: 0; left: 0; right: 0; z-index: 50;\n  transition: background 0.35s ease, padding 0.35s ease, border-color 0.35s ease;\n  padding: 22px 0;\n  background: transparent;\n  border-bottom: 1px solid transparent;\n}\n.nav.scrolled {\n  background: rgba(13,19,34,0.92);\n  -webkit-backdrop-filter: saturate(120%) blur(14px);\n  backdrop-filter: saturate(120%) blur(14px);\n  padding: 14px 0;\n  border-bottom-color: rgba(255,255,255,0.06);\n}\n.nav-inner { display: flex; align-items: center; gap: 24px; }\n.brand { display: flex; align-items: center; gap: 12px; color: var(--white); flex: 0 0 auto; }\n.brand.brand-hex { display: inline-flex; align-items: center; line-height: 0; gap: 0; }\n.brand.brand-hex img { height: 44px; width: auto; display: block; filter: brightness(0) invert(1); }\n.brand.brand-hex:hover img { transform: none; }\n.nav.scrolled .brand.brand-hex img { height: 38px; }\n.brand-wordmark { display: block; line-height: 0; }\n.brand-wordmark img { height: 28px; width: auto; object-fit: contain; display: block; filter: brightness(0) invert(1); }\n.nav .brand-wordmark img { height: 30px; }\n.footer .brand-wordmark img { height: 36px; filter: brightness(0) invert(1); }\n\n.city-pick { position: relative; margin-left: 4px; }\n.city-pick-btn {\n  display: inline-flex; align-items: center; gap: 10px;\n  font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600;\n  color: rgba(255,255,255,0.72);\n  padding: 9px 14px;\n  border: 1px solid rgba(255,255,255,0.16);\n  border-radius: 0;\n  transition: border-color 0.2s ease, color 0.2s ease;\n}\n.city-pick-btn:hover { border-color: rgba(255,255,255,0.32); color: var(--white); }\n.city-pick-btn .chev { transition: transform 0.2s ease; }\n.city-pick.open .city-pick-btn .chev { transform: rotate(180deg); }\n.city-menu {\n  position: absolute; top: calc(100% + 10px); left: 0;\n  min-width: 240px;\n  background: var(--white);\n  color: var(--text-dark);\n  border-radius: var(--r-md);\n  box-shadow: 0 20px 50px rgba(0,0,0,0.2);\n  padding: 8px;\n  opacity: 0; visibility: hidden; transform: translateY(-6px);\n  transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;\n}\n.city-pick.open .city-menu { opacity: 1; visibility: visible; transform: translateY(0); }\n.city-menu-item {\n  display: flex; align-items: center; justify-content: space-between;\n  padding: 10px 12px;\n  border-radius: var(--r-sm);\n  font-size: 13px;\n}\n.city-menu-item.active { background: var(--off-white); color: var(--navy); font-weight: 600; }\n.city-menu-item.soon { color: var(--text-muted); cursor: not-allowed; }\n.city-menu-item .tag { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 8px; border-radius: var(--r-pill); background: var(--off-white-2); color: var(--text-muted); }\n.city-menu-item.active .tag { background: var(--navy); color: var(--white); }\n\n.nav-links { display: flex; gap: 28px; margin: 0 auto; }\n.nav-links a {\n  font-size: 13px; color: rgba(255,255,255,0.6); font-weight: 500;\n  position: relative; padding: 6px 0;\n  transition: color 0.2s ease;\n}\n.nav-links a:hover { color: var(--white); }\n.nav-links a.active { color: var(--white); }\n.nav-links a.active::after {\n  content: \"\"; position: absolute; left: 0; right: 0; bottom: -2px;\n  height: 1px; background: var(--gold);\n}\n\n.nav-cta { display: flex; align-items: center; gap: 16px; flex: 0 0 auto; }\n.nav-write-link {\n  font-size: 11px;\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n  color: rgba(184,150,58,0.85);\n  border-bottom: 1px solid rgba(184,150,58,0.28);\n  padding-bottom: 2px;\n  transition: color 0.2s ease, border-color 0.2s ease;\n  text-decoration: none;\n}\n.nav-write-link:hover { color: var(--gold); border-color: rgba(184,150,58,0.55); }\n\n.nav-burger {\n  display: none;\n  width: 40px; height: 40px;\n  border: 1px solid rgba(255,255,255,0.18 e;\n  min-height: 100vh;\n  background: #000;\n  color: var(--white);\n  display: flex; flex-direction: column;\n  overflow: hidden;\n  padding-top: 110px;\n  padding-bottom: 0;\n}\n.hero-stage {\n  flex: 1;\n  display: flex;\n  align-items: center;\n  position: relative;\n  z-index: 3;\n  padding-bottom: 40px;\n}\n.hero-foot {\n  position: relative;\n  z-index: 3;\n  border-top: 1px solid rgba(255,255,255,0.07);\n  background: rgba(0,0,0,0.65);\n  backdrop-filter: blur(10px);\n  -webkit-backdrop-filter: blur(10px);\n}\n.hero-video {\n  position: absolute; inset: 0;\n  width: 100%; height: 100%;\n  object-fit: cover;\n  z-index: 0;\n  opacity: 0.65;\n  filter: brightness(0.6) saturate(0.8) contrast(1.05);\n}\n.hero-vignette {\n  position: absolute; inset: 0;\n  z-index: 1;\n  pointer-events: none;\n  background:\n    linear-gradient(90deg,\n      rgba(0,0,0,0.82) 0%,\n      rgba(0,0,0,0.65) 30%,\n      rgba(0,0,0,0.30) 58%,\n      rgba(0,0,0,0.05) 78%,\n      rgba(0,0,0,0) 100%),\n    linear-gradient(180deg,\n      rgba(0,0,0,0.35) 0%,\n      rgba(0,0,0,0.08) 22%,\n      rgba(0,0,0,0) 55%,\n      rgba(0,0,0,0.28) 85%,\n      rgba(0,0,0,0.78) 100%);\n}\n.hero .hex-bg { display: none; }\n\n.hero-inner {\n  position: relative; z-index: 3; width: 100%;\n  max-width: var(--maxw); margin: 0 auto;\n  padding-left: var(--gutter); padding-right: var(--gutter);\n}\n\n.hero .eyebrow.on-dark { color: rgba(184,150,58,0.78); font-weight: 600; }\n\n.hero-inner h1.h-display {\n  color: var(--white);\n  text-shadow: 0 2px 24px rgba(0,0,0,0.45), 0 1px 2px rgba(0,0,0,0.4);\n  -webkit-font-smoothing: antialiased;\n}\n\n.hero-body {\n  max-width: 620px; margin-top: 28px; font-size: 16px; line-height: 1.8;\n  color: rgba(255,255,255,0.82) !important;\n  text-shadow: 0 1px 10px rgba(0,0,0,0.55);\n  font-weight: 400;\n}\n.hero-body p + p { margin-top: 14px; }\n\n.hero-ctas { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; margin-top: 36px; }\n\n.hero-inner .btn-ghost {\n  color: rgba(255,255,255,0.88);\n  border: 1px solid rgba(255,255,255,0.22);\n  background: rgba(0,0,0,0.28);\n  backdrop-filter: blur(4px);\n  -webkit-backdrop-filter: blur(4px);\n}\n.hero-inner .btn-ghost:hover {\n  background: rgba(255,255,255,0.92);\n  color: var(--navy-deep);\n  border-color: rgba(255,255,255,0.9);\n}\n\n/* Hero invite link */\n.hero-invite-link {\n  font-size: 11px;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  color: rgba(184,150,58,0.82);\n  border-bottom: 1px solid rgba(184,150,58,0.25);\n  padding-bottom: 2px;\n  text-decoration: none;\n  transition: color 0.2s ease, border-color 0.2s ease;\n}\n.hero-invite-link:hover { color: var(--gold); border-color: rgba(184,150,58,0.5); }\n\n.hex-bg {\n  position: absolute; inset: 0; z-index: 1;\n  background-image:\n    radial-gradient(ellipse at top, rgba(28,43,74,0.18) 0%, transparent 55%),\n    radial-gradient(ellipse at 80% 90%, rgba(28,43,74,0.12) 0%, transparent 50%);\n  pointer-events: none;\n}\n.hex-bg::before {\n  content: \"\";\n  position: absolute; inset: 0;\n  opacity: 0.06;\n  background-image: url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 104' width='120' height='104'><polygon points='30,0 90,0 120,52 90,104 30,104 0,52' fill='none' stroke='%23B8963A' stroke-width='0.8'/><\u002Fsvg>\");\n  background-size: 180px 156px;\n  background-position: center;\n  mask-image: radial-gradient(ellipse at center, black 35%, transparent 80%);\n  -webkit-mask-image: radial-gradient(ellipse at center, black 35%, transparent 80%);\n}\n\n/* ------- Editorial Strip (replaces Stats Bar) ------- */\n.editorial-strip {\n  background: var(--off-white);\n  border-top: 1px solid var(--border);\n  border-bottom: 1px solid var(--border);\n  padding: 18px 0;\n}\n.editorial-strip-inner {\n  display: flex;\n  align-items: center;\n  flex-wrap: wrap;\n  gap: 0;\n  row-gap: 8px;\n}\n.editorial-strip-inner .strip-item {\n  font-size: 10px;\n  letter-spacing: 0.24em;\n  text-transform: uppercase;\n  color: var(--text-muted);\n  margin-right: 20px;\n}\n.editorial-strip-inner .strip-sep {\n  width: 1px;\n  height: 10px;\n  background: var(--border);\n  margin-right: 20px;\n  flex-shrink: 0;\n  display: inline-block;\n}\n.editorial-strip-inner .strip-gold {\n  color: rgba(184,150,58,0.72);\n}\n\n/* ------- Countdown Strip ------- */\n.countdown-strip {\n  background: var(--navy-deep);\n  color: var(--white);\n  padding: clamp(48px, 6vw, 80px) 0;\n  border-top: 1px solid rgba(255,255,255,0.05);\n  border-bottom: 1px solid rgba(255,255,255,0.05);\n  position: relative;\n  overflow: hidden;\n}\n.countdown-strip::before {\n  content: \"\"; position: absolute; inset: 0;\n  background:\n    radial-gradient(ellipse at 15% 50%, rgba(28,43,74,0.3) 0%, transparent 55%),\n    radial-gradient(ellipse at 85% 50%, rgba(28,43,74,0.2) 0%, transparent 55%);\n  pointer-events: none;\n}\n.countdown-strip-inner {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: clamp(32px, 5vw, 80px);\n  position: relative;\n  flex-wrap: wrap;\n}\n.countdown-strip-copy { flex: 0 1 auto; }\n.countdown-strip-copy .h2 { color: var(--white); }\n.cd-strip {\n  font-size: clamp(34px, 4.4vw, 64px);\n  gap: clamp(16px, 2.4vw, 32px);\n  align-items: baseline;\n  flex-wrap: wrap;\n}\n.cd-strip .seg { flex-direction: column; align-items: center; gap: 6px; }\n.cd-strip .suf {\n  display: block;\n  font-family: var(--sans);\n  font-size: 10px;\n  letter-spacing: 0.24em;\n  text-transform: uppercase;\n  font-weight: 600;\n  color: rgba(184,150,58,0.65);\n  margin-top: 2px;\n}\n.cd-strip .sep {\n  width: 1px;\n  height: clamp(40px, 4vw, 56px);\n  background: rgba(255,255,255,0.1);\n  align-self: center;\n}\n.cd-inline {\n  display: inline-flex;\n  align-items: baseline;\n  gap: 18px;\n  font-family: var(--display);\n  font-size: clamp(28px, 3.4vw, 52px);\n  font-weight: 400;\n  letter-spacing: 0.02em;\n  color: var(--white);\n  font-variant-numeric: tabular-nums;\n}\n.cd-inline .seg { display: inline-flex; align-items: baseline; gap: 4px; }\n.cd-inline .suf { font-family: var(--sans); font-size: 0.36em; letter-spacing: 0.12em; color: rgba(184,150,58,0.65); font-weight: 600; }\n\n/* ------- About ------- */\n.about-grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: clamp(40px, 6vw, 96px); align-items: start; }\n.about-copy p { margin: 0 0 18px; font-size: 16px; line-height: 1.82; color: var(--text-muted); max-width: 56ch; }\n.about-copy p strong { color: var(--text-dark); font-weight: 600; }\n\n/* Feature stack — editorial thin-rule list */\n.feature-stack { display: flex; flex-direction: column; border-bottom: 1px solid var(--border); }\n.feature-card {\n  background: transparent;\n  border: none;\n  border-radius: 0;\n  border-top: 1px solid var(--border);\n  padding: 20px 0;\n  display: grid;\n  grid-template-columns: 28px 1fr;\n  gap: 16px;\n  align-items: baseline;\n  position: relative;\n  transition: none;\n}\n.feature-card:hover { transform: none; box-shadow: none; }\n.feature-card .num {\n  position: static;\n  font-family: var(--serif);\n  font-size: 11px;\n  font-weight: 400;\n  color: var(--gold);\n  letter-spacing: 0.06em;\n}\n.feature-card .h4 {\n  color: var(--text-dark);\n  margin-bottom: 6px;\n  font-size: 14px;\n  font-weight: 500;\n  grid-column: 2;\n}\n.feature-card p {\n  margin: 0;\n  font-size: 13px;\n  line-height: 1.65;\n  color: var(--text-muted);\n  grid-column: 2;\n}\n\n/* ------- Themes ------- */\n.themes-grid {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 0;\n  border-top: 1px solid rgba(255,255,255,0.08);\n}\n.theme-card {\n  position: relative;\n  background: transparent;\n  border: none;\n  border-bottom: 1px solid rgba(255,255,255,0.08);\n  border-right: 1px solid rgba(255,255,255,0.08);\n  border-radius: 0;\n  padding: 32px 28px;\n  min-height: 220px;\n  overflow: hidden;\n  transition: background 0.25s ease;\n}\n.theme-card:nth-child(3n) { border-right: none; }\n.theme-card:hover { background: rgba(255,255,255,0.025); }\n.theme-card .num {\n  font-family: var(--serif);\n  font-size: 18px;\n  line-height: 1;\n  font-weight: 400;\n  color: rgba(184,150,58,0.5);\n  display: block;\n  margin-bottom: 16px;\n}\n.theme-card .h3 { margin-bottom: 10px; font-size: clamp(18px, 1.8vw, 22px); }\n.theme-card p { font-size: 14px; line-height: 1.65; color: rgba(255,255,255,0.58); margin: 0; }\n.theme-card .hex-mark {\n  position: absolute; right: -40px; bottom: -40px;\n  width: 160px; height: 160px;\n  opacity: 0.03;\n  pointer-events: none;\n}\n\n.attendee-block { margin-top: clamp(60px, 7vw, 100px); }\n.attendee-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(40px, 5vw, 72px); align-items: start; }\n\n/* Role list — editorial italic prose (replaces pill tags) */\n.role-list {\n  font-family: var(--serif);\n  font-size: 17px;\n  font-style: italic;\n  color: rgba(255,255,255,0.58);\n  line-height: 1.8;\n  max-width: 60ch;\n  margin: 20px 0 0;\n}\n\n/* Keep .role-tags and .role-tag as fallback if used elsewhere */\n.role-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }\n.role-tag {\n  font-size: 11px;\n  padding: 8px 14px;\n  border: 1px solid rgba(255,255,255,0.12);\n  border-radius: 0;\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: rgba(255,255,255,0.72);\n  background: rgba(255,255,255,0.02);\n}\n\n/* ------- Speakers ------- */\n.speakers-teaser {\n  background: var(--white);\n  border: 1px solid var(--border);\n  border-top: 2px solid var(--gold);\n  padding: clamp(56px, 7vw, 96px);\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: clamp(40px, 6vw, 96px);\n  align-items: center;\n}\n.speakers-teaser .teaser-num {\n  font-family: var(--display);\n  font-size: clamp(80px, 11vw, 160px);\n  line-height: 1;\n  font-weight: 400;\n  color: var(--navy);\n  letter-spacing: -0.02em;\n}\n.speakers-teaser .teaser-num sup {\n  color: var(--navy-light);\n  font-size: 0.4em;\n  vertical-align: top;\n  margin-left: 6px;\n}\n.speakers-teaser .teaser-sub {\n  display: block;\n  margin-top: 14px;\n  font-family: var(--sans);\n  font-size: 11px;\n  letter-spacing: 0.22em;\n  text-transform: uppercase;\n  color: var(--text-muted);\n  font-weight: 600;\n}\n.speakers-teaser p { font-size: 16px; line-height: 1.78; color: var(--text-muted); margin: 0 0 28px; }\n.speakers-teaser .h3 { margin-bottom: 16px; }\n.speakers-teaser .btn-link { color: var(--navy); }\n.speakers-teaser .btn-link:hover { color: var(--navy-light); border-bottom-color: var(--navy-light); }\n\n/* ------- Agenda ------- */\n.tabs {\n  display: inline-flex;\n  gap: 0;\n  background: transparent;\n  border: 1px solid rgba(255,255,255,0.12);\n  border-radius: 0;\n  margin-bottom: 48px;\n  flex-wrap: wrap;\n}\n.tab {\n  padding: 13px 24px;\n  font-size: 10px;\n  font-weight: 600;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  color: rgba(255,255,255,0.55);\n  border-radius: 0;\n  border-right: 1px solid rgba(255,255,255,0.12);\n  transition: background 0.2s ease, color 0.2s ease;\n}\n.tab:last-child { border-right: none; }\n.tab.active { background: var(--navy); color: var(--white); }\n.tab:hover:not(.active) { color: var(--white); }\n\n.tab-panel { display: none; }\n.tab-panel.active { display: block; animation: fadein 0.35s ease; }\n@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }\n\n.agenda-row {\n  display: grid;\n  grid-template-columns: 100px 1fr 200px;\n  gap: 32px;\n  padding: 20px 22px;\n  border-radius: 0;\n  align-items: start;\n  border-bottom: 1px solid rgba(255,255,255,0.06);\n}\n.agenda-row:nth-child(odd) { background: rgba(255,255,255,0.015); }\n.agenda-row.break { opacity: 0.45; }\n.agenda-row .time { font-family: var(--serif); font-size: 20px; color: rgba(184,150,58,0.7); font-weight: 400; }\n.agenda-row .title { color: var(--white); font-weight: 500; font-size: 16px; margin-bottom: 8px; line-height: 1.3; }\n.agenda-row .format { font-size: 13.5px; color: rgba(255,255,255,0.55); line-height: 1.58; margin-bottom: 12px; max-width: 56ch; }\n.agenda-row .output {\n  display: inline-flex; align-items: center; gap: 8px;\n  font-size: 11px; letter-spacing: 0.04em;\n  color: rgba(184,150,58,0.75);\n  padding: 5px 11px;\n  background: rgba(184,150,58,0.08);\n  border-radius: 0;\n}\n.agenda-row .spk-meta { font-size: 12px; color: rgba(255,255,255,0.55); text-align: right; letter-spacing: 0.04em; }\n.agenda-row .spk-meta .badge {\n  display: inline-block;\n  padding: 5px 11px;\n  background: rgba(255,255,255,0.04);\n  border: 1px solid rgba(255,255,255,0.08);\n  border-radius: 0;\n}\n\n.dinner-summary {\n  background: rgba(255,255,255,0.03);\n  border: 1px solid rgba(255,255,255,0.08);\n  border-left: 2px solid var(--gold);\n  border-radius: 0;\n  padding: clamp(36px, 5vw, 64px);\n}\n.dinner-summary .h3 { color: var(--white); margin-bottom: 12px; }\n.dinner-summary p { font-size: 15px; line-height: 1.75; color: rgba(255,255,255,0.7); max-width: 64ch; }\n.dinner-summary .eyebrow.on-dark { color: var(--gold); }\n\n/* ------- Sponsors ------- */\n.tier-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }\n.tier-card {\n  background: var(--white);\n  border: 1px solid var(--border);\n  border-radius: 0;\n  padding: 32px 28px;\n  position: relative;\n  overflow: hidden;\n  display: flex; flex-direction: column;\n}\n.tier-card.platinum {\n  background: var(--navy-deep); color: var(--white);\n  border-color: var(--navy-deep);\n  border-left: 3px solid var(--gold);\n  padding-left: 32px;\n}\n.tier-card.gold  { border-top: 2px solid #B8963A; }\n.tier-card.silver { border-top: 2px solid #9DA7B8; }\n.tier-card.bronze { border-top: 2px solid #B97A4A; }\n.tier-badge {\n  font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 700;\n  margin-bottom: 16px; display: inline-block; padding: 5px 10px; border: 1px solid currentColor;\n}\n.tier-card.platinum .tier-badge { background: var(--gold); color: #1B1407; padding: 5px 12px; border: none; }\n.tier-card.gold    .tier-badge { color: #8A6B20; }\n.tier-card.silver  .tier-badge { color: #6C7589; }\n.tier-card.bronze  .tier-badge { color: #8A5A35; }\n.tier-card .tier-name  { font-family: var(--serif); font-size: 20px; margin-bottom: 6px; font-weight: 400; }\n.tier-card .tier-price { font-size: 12px; color: var(--text-muted); margin-bottom: 18px; }\n.tier-card.platinum .tier-price { color: rgba(255,255,255,0.55); }\n.tier-card ul { list-style: none; padding: 0; margin: 0 0 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }\n.tier-card li { font-size: 13px; line-height: 1.5; padding-left: 18px; position: relative; color: var(--text-muted); }\n.tier-card.platinum li { color: rgba(255,255,255,0.68); }\n.tier-card li::before { content: \"\"; position: absolute; left: 0; top: 8px; width: 8px; height: 1px; background: currentColor; opacity: 0.4; }\n\n.sponsor-logos { margin-top: clamp(60px, 6vw, 96px); display: flex; flex-direction: column; gap: 28px; }\n.sponsor-row .label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 600; color: var(--text-muted); margin-bottom: 14px; }\n.sponsor-row .label.platinum { color: var(--navy); }\n.sponsor-row .label.gold { color: #8A6B20; }\n.sponsor-row .label.silver { color: #6C7589; }\n.sponsor-row .label.bronze { color: #8A5A35; }\n.sponsor-row .slots { display: grid; gap: 14px; }\n.sponsor-row.platinum .slots { grid-template-columns: 1fr; }\n.sponsor-row.gold   .slots { grid-template-columns: repeat(2, 1fr); }\n.sponsor-row.silver .slots { grid-template-columns: repeat(3, 1fr); }\n.sponsor-row.bronze .slots { grid-template-columns: repeat(4, 1fr); }\n.logo-slot {\n  border: 1px dashed var(--border);\n  border-radius: 0;\n  height: 96px;\n  display: flex; align-items: center; justify-content: center;\n  color: var(--text-muted);\n  font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;\n  background: var(--off-white-2);\n}\n.sponsor-row.platinum .logo-slot { height: 140px; font-size: 13px; }\n.sponsor-row.bronze  .logo-slot { height: 76px; }\n\n.sponsor-cta {\n  background: var(--navy-deep);\n  color: var(--white);\n  padding: clamp(28px, 4vw, 44px) clamp(32px, 5vw, 56px);\n  border-radius: 0;\n  display: flex; align-items: center; justify-content: space-between; gap: 32px;\n  margin-top: clamp(48px, 5vw, 72px);\n}\n.sponsor-cta .h3 { color: var(--white); margin: 0 0 6px; }\n.sponsor-cta p { margin: 0; color: rgba(255,255,255,0.62); font-size: 14px; max-width: 56ch; }\n\n/* ------- Dinner ------- */\n.dinner-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: clamp(40px, 6vw, 96px); align-items: start; }\n.dinner-text p { font-size: 16px; line-height: 1.8; color: rgba(255,255,255,0.7); }\n\n.timeline { position: relative; padding-left: 28px; }\n.timeline::before {\n  content: \"\"; position: absolute; left: 6px; top: 8px; bottom: 8px;\n  width: 1px; background: rgba(255,255,255,0.12);\n}\n.timeline-item { position: relative; padding: 12px 0 12px 12px; }\n.timeline-item::before {\n  content: \"\"; position: absolute; left: -28px; top: 18px;\n  width: 11px; height: 11px;\n  background: var(--gold);\n  border-radius: 50%;\n  opacity: 0.6;\n}\n.timeline-item .time  { font-family: var(--serif); font-size: 17px; color: rgba(184,150,58,0.7); font-weight: 400; display: block; }\n.timeline-item .title { font-size: 14px; color: var(--white); font-weight: 500; margin-top: 2px; display: block; }\n.timeline-item .desc  { font-size: 13px; color: rgba(255,255,255,0.52); margin-top: 4px; }\n\n.dinner-spec {\n  margin: 32px 0 0; padding: 24px 0 0;\n  border-top: 1px solid rgba(184,150,58,0.14);\n  display: grid; gap: 14px;\n}\n.dinner-spec > div { display: grid; grid-template-columns: 110px 1fr; gap: 24px; align-items: baseline; }\n.dinner-spec dt { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(184,150,58,0.55); font-weight: 600; }\n.dinner-spec dd { margin: 0; font-size: 14px; color: rgba(255,255,255,0.75); line-height: 1.55; }\n\n/* ------- Venue ------- */\n.venue-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }\n.venue-card { background: var(--white); border: 1px solid var(--border); border-radius: 0; padding: clamp(28px, 4vw, 44px); }\n.venue-image, .venue-map {\n  background: var(--off-white);\n  border-radius: 0;\n  height: 360px; border: 1px solid var(--border);\n  display: flex; align-items: center; justify-content: center;\n  color: var(--text-muted);\n  position: relative; overflow: hidden;\n}\n.venue-image::after, .venue-map::after {\n  content: \"\"; position: absolute; inset: 0;\n  background-image: repeating-linear-gradient(135deg, transparent 0 10px, rgba(27,45,74,0.03) 10px 11px);\n}\n.venue-image .lbl, .venue-map .lbl {\n  position: relative; display: inline-flex; align-items: center; gap: 8px;\n  font-family: monospace; font-size: 11px;\n  padding: 8px 14px; background: rgba(255,255,255,0.9);\n  border: 1px solid var(--border); border-radius: var(--r-sm); color: var(--text-muted);\n}\n\n.placeholder {\n  border: 1px dashed var(--gold);\n  background: var(--gold-soft);\n  padding: 16px 20px; border-radius: 0;\n  color: var(--gold-text); font-style: italic; font-size: 13px; display: block; margin: 14px 0;\n}\n.placeholder strong { font-style: normal; color: var(--gold-text); }\n\n/* ------- Tickets ------- */\n.tickets-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 1080px; }\n.ticket-card {\n  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);\n  border-radius: 0; padding: 28px 24px; display: flex; flex-direction: column; position: relative;\n}\n.ticket-card.best { border-color: var(--gold); background: rgba(184,150,58,0.06); }\n.ticket-card.best .best-badge {\n  position: absolute; top: -12px; left: 24px;\n  font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;\n  background: var(--gold); color: #1B1407;\n  padding: 5px 12px; border-radius: 0; font-weight: 700;\n}\n.ticket-card .t-name  { font-size: 12px; color: rgba(184,150,58,0.75); letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; margin-bottom: 10px; }\n.ticket-card .t-price { font-family: var(--serif); font-size: 40px; font-weight: 400; color: var(--white); line-height: 1; }\n.ticket-card .t-price .cur { font-size: 17px; color: rgba(184,150,58,0.7); vertical-align: top; margin-right: 4px; }\n.ticket-card .t-meta { font-size: 13px; color: rgba(255,255,255,0.55); margin-top: 14px; line-height: 1.5; }\n.ticket-card .t-cta { margin-top: auto; padding-top: 22px; }\n.ticket-card .t-cta .btn { width: 100%; justify-content: center; padding: 12px 18px; font-size: 11px; }\n\n.tickets-info { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 36px; }\n.info-card {\n  background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.07);\n  border-radius: 0; padding: 28px 30px;\n}\n.info-card .h4 { color: var(--white); margin-bottom: 8px; }\n.info-card p   { color: rgba(255,255,255,0.62); font-size: 14px; margin: 0; line-height: 1.6; }\n\n/* ------- Media & Press ------- */\n.media-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: stretch; }\n.media-card { background: var(--white); border: 1px solid var(--border); border-radius: 0; padding: 36px 32px; }\n.media-card .h3 { margin-bottom: 8px; }\n.media-card p   { color: var(--text-muted); margin: 0 0 22px; font-size: 14px; }\n\n/* ------- About the Organiser ------- */\n.organiser-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: clamp(56px, 7vw, 120px); align-items: start; }\n.organiser-copy p { font-size: 16px; line-height: 1.82; color: var(--text-muted); margin: 0 0 22px; max-width: 58ch; }\n.organiser-copy p strong { color: var(--text-dark); font-weight: 600; }\n.organiser-aside {\n  background: var(--white);\n  border: 1px solid var(--border);\n  border-top: 2px solid var(--gold);\n  padding: clamp(36px, 4vw, 52px);\n}\n.organiser-aside .h3 { margin-bottom: 18px; }\n.organiser-aside p { color: var(--text-muted); font-size: 14px; line-height: 1.72; margin: 0 0 18px; }\n.organiser-aside .contact-row {\n  display: flex; flex-direction: column; gap: 14px;\n  margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border);\n}\n.organiser-aside .contact-row a {\n  font-family: var(--display); font-size: 17px; letter-spacing: 0.04em;\n  color: var(--navy); border-bottom: 1px solid var(--gold); padding-bottom: 4px;\n  align-self: flex-start;\n  transition: color 0.2s ease, border-color 0.2s ease;\n}\n.organiser-aside .contact-row a:hover { color: var(--navy-light); border-color: var(--navy); }\n.organiser-aside .contact-label { font-size: 9px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }\n\n/* ------- Footer ------- */\n.footer { background: var(--navy-deep); color: rgba(255,255,255,0.65); padding: 72px 0 32px; }\n.footer-top { display: grid; grid-template-columns: 1fr 1.8fr; gap: clamp(56px, 8vw, 120px); align-items: start; padding-bottom: 48px; border-bottom: 1px solid rgba(255,255,255,0.06); }\n.footer-brand .footer-social { margin-top: 28px; }\n.footer-brand p { font-size: 13px; line-height: 1.68; color: rgba(255,255,255,0.45); margin-top: 18px; max-width: 36ch; }\n.footer-nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(24px, 4vw, 56px); }\n.footer-nav h5 { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(184,150,58,0.65); margin: 0 0 14px; font-weight: 600; }\n.footer-nav ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }\n.footer-nav a { font-size: 13px; color: rgba(255,255,255,0.62); }\n.footer-nav a:hover { color: var(--white); }\n.footer-nav .footer-email a { color: rgba(255,255,255,0.8); }\n.footer-nav .footer-email a:hover { color: var(--gold); }\n.footer-nav .footer-email .em-label { display: block; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.35); margin-bottom: 4px; }\n.footer-social { display: flex; gap: 10px; }\n.footer-social a {\n  width: 36px; height: 36px;\n  border: 1px solid rgba(255,255,255,0.12); border-radius: 50%;\n  display: flex; align-items: center; justify-content: center;\n  color: rgba(255,255,255,0.65);\n  transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;\n}\n.footer-social a:hover { background: var(--gold); border-color: var(--gold); color: #1B1407; }\n.footer-bot { display: flex; justify-content: space-between; align-items: center; gap: 32px; padding-top: 28px; font-size: 12px; color: rgba(255,255,255,0.38); }\n.footer-bot .links a { margin: 0; }\n.footer-bot .links a + a { margin-left: 22px; }\n\n/* ------- Reveal Animations ------- */\n.reveal { opacity: 0; transform: translateY(16px); transition: opacity 0.7s ease, transform 0.7s ease; }\n.reveal.in { opacity: 1; transform: translateY(0); }\n\n/* ------- Mobile Drawer ------- */\n.drawer {\n  position: fixed; inset: 0; z-index: 60;\n  background: var(--navy-deep); color: var(--white);\n  padding: 24px var(--gutter);\n  transform: translateX(100%);\n  transition: transform 0.3s ease;\n  display: flex; flex-direction: column;\n}\n.drawer.open { transform: translateX(0); }\n.drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }\n.drawer-close { font-size: 24px; color: var(--white); padding: 8px; }\n.drawer-links { display: flex; flex-direction: column; gap: 4px; }\n.drawer-links a { font-family: var(--serif); font-size: 26px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.06); color: var(--white); }\n\n/* ------- Responsive ------- */\n@media (max-width: 1080px) {\n  .nav-links { display: none; }\n  .themes-grid { grid-template-columns: repeat(2, 1fr); }\n  .themes-grid .theme-card:nth-child(2n)  { border-right: none; }\n  .themes-grid .theme-card:nth-child(3n)  { border-right: 1px solid rgba(255,255,255,0.08); }\n  .tier-grid { grid-template-columns: repeat(2, 1fr); }\n  .tickets-grid { grid-template-columns: repeat(3, 1fr); }\n  .organiser-grid, .speakers-teaser { grid-template-columns: 1fr; gap: 40px; }\n}\n@media (max-width: 760px) {\n  .nav-burger { display: flex; }\n  .city-pick { display: none; }\n  .nav-cta .btn { padding: 8px 14px; font-size: 11px; }\n  .about-grid, .attendee-grid, .dinner-grid, .venue-grid, .media-grid, .tickets-info { grid-template-columns: 1fr; gap: 36px; }\n  .footer-top { grid-template-columns: 1fr; gap: 40px; }\n  .footer-nav { grid-template-columns: repeat(2, 1fr); gap: 32px 24px; }\n  .themes-grid { grid-template-columns: 1fr; }\n  .themes-grid .theme-card { border-right: none !important; }\n  .tier-grid, .tickets-grid { grid-template-columns: 1fr; }\n  .agenda-row { grid-template-columns: 72px 1fr; gap: 14px; }\n  .agenda-row .spk-meta { display: none; }\n  .sponsor-cta { flex-direction: column; align-items: flex-start; }\n  .footer-bot { flex-direction: column; align-items: flex-start; gap: 12px; }\n  .hero { padding-top: 110px; }\n  .hero-vignette {\n    background:\n      linear-gradient(180deg,\n        rgba(0,0,0,0.58) 0%,\n        rgba(0,0,0,0.28) 25%,\n        rgba(0,0,0,0.22) 55%,\n        rgba(0,0,0,0.55) 85%,\n        rgba(0,0,0,0.88) 100%);\n  }\n  .countdown-strip-inner { flex-direction: column; align-items: flex-start; }\n  .cd-strip .sep { display: none; }\n  .cd-strip { gap: 24px 20px; }\n  .dinner-spec > div { grid-template-columns: 1fr; gap: 4px; }\n  .editorial-strip-inner { flex-direction: column; align-items: flex-start; gap: 8px; }\n  .editorial-strip-inner .strip-sep { display: none; }\n}\n\n/* ------- Editorial Hero (UHNW direction) ------- */\n.hero-editorial {\n  min-height: auto;\n  background: var(--navy-deep);\n  color: var(--white);\n  padding: clamp(140px, 14vw, 200px) 0 clamp(56px, 7vw, 96px);\n  display: block;\n  overflow: visible;\n}\n.hero-editorial .hero-video,\n.hero-editorial .hero-vignette,\n.hero-editorial .hex-bg,\n.hero-editorial .hero-foot { display: none; }\n.hero-editorial .hero-stage {\n  flex: none;\n  display: block;\n  padding-bottom: 0;\n  background: transparent;\n}\n.hero-editorial .hero-inner {\n  max-width: 720px;\n  margin: 0;\n  padding-left: 0;\n  padding-right: 0;\n}\n.hero-editorial .invitation-signal { margin-bottom: 26px; }\n.hero-editorial h1.h-display {\n  margin: 0 0 26px;\n  font-family: var(--serif);\n  font-weight: 400;\n  font-size: clamp(36px, 5.2vw, 62px);\n  line-height: 1.08;\n  letter-spacing: -0.01em;\n  color: rgba(246,242,235,0.96);\n  text-shadow: none;\n}\n.hero-editorial .hero-body {\n  margin: 0 0 36px;\n  font-size: clamp(15px, 1.15vw, 17px);\n  line-height: 1.78;\n  color: rgba(246,242,235,0.6) !important;\n  text-shadow: none;\n  max-width: 56ch;\n  font-weight: 400;\n}\n.hero-editorial .hero-ctas {\n  margin-top: 0;\n  display: flex;\n  align-items: center;\n  gap: 28px 36px;\n  flex-wrap: wrap;\n}\n.hero-link {\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  font-size: 11px;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  color: rgba(246,242,235,0.7);\n  border-bottom: 1px solid rgba(246,242,235,0.2);\n  padding-bottom: 3px;\n  text-decoration: none;\n  transition: color 0.2s ease, border-color 0.2s ease;\n}\n.hero-link:hover { color: var(--white); border-color: rgba(246,242,235,0.55); }\n.hero-link .arrow { transition: transform 0.2s ease; }\n.hero-link:hover .arrow { transform: translateX(4px); }\n.hero-link--gold {\n  color: rgba(184,150,58,0.82);\n  border-bottom-color: rgba(184,150,58,0.28);\n}\n.hero-link--gold:hover { color: var(--gold); border-color: rgba(184,150,58,0.6); }\n\n.hero-detail-strip {\n  margin-top: clamp(48px, 6vw, 72px);\n  padding-top: 22px;\n  border-top: 1px solid rgba(246,242,235,0.08);\n  display: grid;\n  grid-template-columns: max-content 1px max-content;\n  column-gap: 18px;\n  row-gap: 10px;\n  align-items: center;\n  justify-content: start;\n  justify-items: start;\n}\n.hero-detail-row { display: contents; }\n.hero-detail-row--meta > span:first-child,\n.hero-detail-row--meta > .hero-sep {\n  margin-top: 6px;\n  padding-top: 12px;\n  border-top: 1px solid rgba(246,242,235,0.05);\n}\n.hero-detail-row--meta > span:last-child {\n  margin-top: 6px;\n  padding-top: 12px;\n  border-top: 1px solid rgba(246,242,235,0.05);\n}\n.hero-detail-strip > .hero-detail-row > span {\n  font-size: 10px;\n  letter-spacing: 0.22em;\n  text-transform: uppercase;\n  color: rgba(246,242,235,0.4);\n  margin-right: 0;\n}\n.hero-detail-strip .hero-sep {\n  width: 1px;\n  height: 9px;\n  background: rgba(246,242,235,0.1);\n  margin-right: 0;\n  flex-shrink: 0;\n  display: inline-block;\n  padding: 0;\n  justify-self: center;\n}\n.hero-detail-strip .hero-gold { color: rgba(184,150,58,0.55); }\n\n@media (max-width: 640px) {\n  .hero-detail-row { grid-template-columns: 1fr; row-gap: 4px; }\n  .hero-detail-row .hero-sep { display: none; }\n}\n\n/* ------- Editorial Themes List (replaces 3-col card grid) ------- */\n.themes-editorial {\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr);\n  gap: clamp(40px, 6vw, 88px);\n  align-items: start;\n}\n.themes-intro .eyebrow { color: var(--blue); }\n.themes-intro .h2 {\n  margin: 12px 0 18px;\n  color: rgba(246,242,235,0.92);\n}\n.themes-intro .lede { font-size: 14px; color: rgba(246,242,235,0.5); }\n\n.themes-list {\n  list-style: none;\n  padding: 0;\n  margin: 0;\n  border-bottom: 1px solid rgba(246,242,235,0.08);\n}\n.themes-list .theme-row {\n  border-top: 1px solid rgba(246,242,235,0.08);\n  padding: 18px 0;\n  display: grid;\n  grid-template-columns: 38px 1fr;\n  gap: 16px;\n  align-items: baseline;\n}\n.themes-list .theme-row .num {\n  font-family: var(--serif);\n  font-size: 18px;\n  font-weight: 400;\n  color: rgba(184,150,58,0.5);\n  letter-spacing: 0.04em;\n}\n.themes-list .theme-title {\n  font-family: var(--sans);\n  font-size: 14px;\n  font-weight: 500;\n  color: rgba(246,242,235,0.9);\n  margin: 0 0 6px;\n  letter-spacing: 0.01em;\n  line-height: 1.3;\n}\n.themes-list .theme-row p {\n  margin: 0;\n  font-size: 13px;\n  line-height: 1.65;\n  color: rgba(246,242,235,0.46);\n}\n\n@media (max-width: 880px) {\n  .themes-editorial { grid-template-columns: 1fr; gap: 32px; }\n  .hero-detail-strip { flex-direction: column; align-items: flex-start; gap: 6px; }\n  .hero-detail-strip .hero-sep { display: none; }\n  .hero-detail-strip > span { margin-right: 0; }\n}\n\n/* ------- The Thirty-Three (dinner) ------- */\n.thirty-three {\n  display: grid;\n  grid-template-columns: minmax(220px, 320px) 1fr;\n  gap: clamp(48px, 7vw, 120px);\n  align-items: start;\n  padding-top: clamp(24px, 3vw, 48px);\n  border-top: 1px solid rgba(184,150,58,0.18);\n}\n.tt-mark {\n  display: flex;\n  flex-direction: column;\n  align-items: flex-start;\n  gap: 24px;\n}\n.tt-mark .tt-roman {\n  font-family: var(--display);\n  font-weight: 400;\n  font-size: clamp(64px, 9vw, 120px);\n  line-height: 0.95;\n  letter-spacing: 0.04em;\n  color: var(--gold);\n  display: block;\n}\n.tt-mark .tt-rule {\n  width: 64px;\n  height: 1px;\n  background: rgba(184,150,58,0.55);\n  display: block;\n}\n.tt-mark .tt-label {\n  font-family: var(--sans);\n  font-size: 10px;\n  letter-spacing: 0.32em;\n  text-transform: uppercase;\n  font-weight: 600;\n  color: rgba(184,150,58,0.78);\n}\n.tt-body .h2 {\n  color: var(--white);\n  font-family: var(--serif);\n  font-style: italic;\n  font-weight: 400;\n  letter-spacing: -0.01em;\n}\n.tt-body p {\n  margin: 22px 0 0;\n  font-size: 15.5px;\n  line-height: 1.78;\n  color: rgba(255,255,255,0.7);\n  max-width: 62ch;\n}\n.tt-body p + p { margin-top: 14px; }\n.tt-body .dinner-spec {\n  margin-top: 36px;\n  padding-top: 24px;\n  border-top: 1px solid rgba(184,150,58,0.18);\n}\n.tt-body .dinner-spec > div { grid-template-columns: 130px 1fr; }\n\n@media (max-width: 860px) {\n  .thirty-three { grid-template-columns: 1fr; gap: 32px; }\n  .tt-mark .tt-roman { font-size: 80px; }\n}\n\n/* ------- Print ------- */\n@media print {\n  .nav, .drawer, .hex-bg, .footer-social { display: none !important; }\n  .section, .hero, .editorial-strip { padding: 24px !important; page-break-inside: avoid; }\n  body { color: #000; background: #fff; }\n  .section.dark, .editorial-strip, .hero, .countdown-strip { background: #fff !important; color: #000 !important; }\n  h1, h2, h3, h4 { color: #000 !important; }\n}\n<\u002Fstyle>\n\n\n<\u002Fhead>\n<body>\n\n<a href=\"#home\" class=\"skip-link\">Skip to main content<\u002Fa>\n\n<!-- ============================= NAV ============================= -->\n<header class=\"nav\" id=\"nav\" aria-label=\"Primary navigation\">\n  <div class=\"container nav-inner\">\n    <a href=\"#home\" class=\"brand brand-hex\" aria-label=\"RegSymp home\">\n      <img src=\"a1374fe9-cce0-4345-8dc2-6ad4f775f872\" alt=\"RegSymp\">\n    <\u002Fa>\n    <div class=\"city-pick\" id=\"cityPick\" style=\"margin-right:auto;\">\n      <button class=\"city-pick-btn\" id=\"cityPickBtn\" aria-expanded=\"false\" aria-haspopup=\"listbox\">\n        <span>Palma de Mallorca 2026<\u002Fspan>\n        <svg class=\"chev\" width=\"10\" height=\"6\" viewBox=\"0 0 10 6\" fill=\"none\" aria-hidden=\"true\"><path d=\"M1 1l4 4 4-4\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n      <div class=\"city-menu\" role=\"listbox\" aria-label=\"City editions\">\n        <div class=\"city-menu-item active\"><span>Palma de Mallorca 2026<\u002Fspan><span class=\"tag\">Active<\u002Fspan><\u002Fdiv>\n        <div class=\"city-menu-item\"><span>Toronto 2026<\u002Fspan><span class=\"tag\">Active<\u002Fspan><\u002Fdiv>\n        <div class=\"city-menu-item soon\"><span>Dubai<\u002Fspan><span class=\"tag\">Coming soon<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <nav class=\"nav-links\" id=\"navLinks\" aria-label=\"Sections\">\n      <a href=\"#about\">About<\u002Fa>\n      <a href=\"#why\">Why Attend<\u002Fa>\n      <a href=\"#speakers\">Speakers<\u002Fa>\n      <a href=\"#agenda\">Agenda<\u002Fa>\n      <a href=\"#sponsors\">Sponsors<\u002Fa>\n    <\u002Fnav>\n\n    <div class=\"nav-cta\">\n      <a href=\"mailto:info@regsymp.com\" class=\"nav-write-link\">Write to us →<\u002Fa>\n      <button class=\"nav-burger\" id=\"burger\" aria-label=\"Open menu\" aria-controls=\"drawer\">\n        <span><\u002Fspan><span><\u002Fspan><span><\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- Mobile drawer -->\n<aside class=\"drawer\" id=\"drawer\" aria-hidden=\"true\">\n  <div class=\"drawer-head\">\n    <span class=\"brand-wordmark\"><img src=\"ae3620a8-b7c1-4720-b9eb-d9f52eed9c0f\" alt=\"RegSymp\"><\u002Fspan>\n    <button class=\"drawer-close\" id=\"drawerClose\" aria-label=\"Close menu\">×<\u002Fbutton>\n  <\u002Fdiv>\n  <nav class=\"drawer-links\" aria-label=\"Mobile sections\">\n    <a href=\"#about\">About the Event<\u002Fa>\n    <a href=\"#why\">Why Attend<\u002Fa>\n    <a href=\"#speakers\">Speakers<\u002Fa>\n    <a href=\"#agenda\">Agenda<\u002Fa>\n    <a href=\"#organiser\">Organiser<\u002Fa>\n    <a href=\"#sponsors\">Sponsors &amp; Partners<\u002Fa>\n    <a href=\"#venue\">Venue<\u002Fa>\n    <a href=\"mailto:info@regsymp.com\"><\u002Fa>\n  <\u002Fnav>\n<\u002Faside>\n\n<main id=\"home\">\n\n<!-- ============================= HERO ============================= -->\n<section class=\"hero hero-editorial\" data-screen-label=\"01 Hero\">\n  <div class=\"hero-stage\">\n    <div class=\"container\">\n      <div class=\"hero-inner\">\n        <p class=\"invitation-signal\">— By Invitation Only<\u002Fp>\n        <h1 class=\"h-display\">Shaping the<br>Future of Finance.<\u002Fh1>\n        <p class=\"hero-body\">We bring together traditional finance, private wealth, fintech and Web3 leaders to bridge the gap between institutional finance and digital innovation.<\u002Fp>\n\n        <div class=\"hero-ctas\">\n          <a href=\"#agenda\" class=\"hero-link\">The Programme <span class=\"arrow\">→<\u002Fspan><\u002Fa>\n          <a href=\"mailto:info@regsymp.com\" class=\"hero-link hero-link--gold\">Request an Introduction <span class=\"arrow\">→<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n\n        <div class=\"hero-detail-strip\" aria-label=\"Event details\">\n          <div class=\"hero-detail-row\">\n            <span>September 2026<\u002Fspan>\n            <span class=\"hero-sep\"><\u002Fspan>\n            <span>Palma, Mallorca<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"hero-detail-row\">\n            <span>October 2026<\u002Fspan>\n            <span class=\"hero-sep\"><\u002Fspan>\n            <span>Toronto, Ontario<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"hero-detail-row hero-detail-row--meta\">\n            <span>100 Senior Delegates<\u002Fspan>\n            <span class=\"hero-sep\"><\u002Fspan>\n            <span class=\"hero-gold\">Chatham House Rules<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================= ABOUT ============================= -->\n<section class=\"section light\" id=\"about\" data-screen-label=\"03 About\">\n  <div class=\"container reveal\">\n    <div class=\"about-grid\">\n      <div class=\"about-copy\">\n        <span class=\"eyebrow\">Why Now.<\u002Fspan>\n        <h2 class=\"h2\" style=\"margin-bottom:28px;\">About RegSymp<\u002Fh2>\n        <p>The financial services sector is at an inflection point. Open Banking is moving from policy paper to operational reality. The retail payments oversight regime is live. AML, sanctions and client-asset frameworks are tightening and the boards of every major institution are being asked harder questions than ever before.<\u002Fp>\n        <p>RegSymp brings together <strong>CEOs, Founders, CCOs, CROs, MLROs, COOs, General Counsels and Heads of Custody<\u002Fstrong> from the leading banks, asset managers, dealers, fintechs and crypto firms alongside their regulators, auditors and advisors to debate what comes next.<\u002Fp>\n        <a href=\"#why\" class=\"btn-link\" style=\"color:var(--navy); margin-top:8px;\">Read the full programme thesis <span class=\"arrow\">→<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n\n      <aside class=\"feature-stack\" aria-label=\"What makes RegSymp different\">\n        <div class=\"feature-card\"><span class=\"num\">01<\u002Fspan><h3 class=\"h4\">Industry-led<\u002Fh3><p>Sessions chaired and curated by today's leaders in finance.<\u002Fp><\u002Fdiv>\n        <div class=\"feature-card\"><span class=\"num\">02<\u002Fspan><h3 class=\"h4\">Exclusive audience<\u002Fh3><p>Invitation only. 100 senior delegates.<\u002Fp><\u002Fdiv>\n        <div class=\"feature-card\"><span class=\"num\">03<\u002Fspan><h3 class=\"h4\">Local-first lens<\u002Fh3><p>Leading regulators in the room with the international comparators that matter.<\u002Fp><\u002Fdiv>\n        \n    <\u002Faside><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================= WHY ATTEND / THEMES ============================= -->\n<section class=\"section dark\" id=\"why\" data-screen-label=\"04 Themes\">\n  <div class=\"container reveal\">\n    <div class=\"themes-editorial\">\n      <div class=\"themes-intro\">\n        <span class=\"eyebrow on-dark\">The Programme Thesis<\u002Fspan>\n        <h2 class=\"h2\">Five critical themes<br>for 2026.<\u002Fh2>\n        <p class=\"lede on-dark\">Every session at RegSymp maps to one of five themes that the programme committee has identified as the most consequential regulatory and operational shifts facing major financial institutions over the next 24 months.<\u002Fp>\n      <\u002Fdiv>\n\n      <ol class=\"themes-list\" aria-label=\"Programme themes\">\n        <li class=\"theme-row\"><span class=\"num\">01<\u002Fspan><div><h3 class=\"theme-title\">The Future of European Finance<\u002Fh3><p>Can Europe lead the next era of financial innovation across banking, payments, AI and digital assets while remaining globally competitive?<\u002Fp><\u002Fdiv><\u002Fli>\n        <li class=\"theme-row\"><span class=\"num\">02<\u002Fspan><div><h3 class=\"theme-title\">Payments, Stablecoins &amp; Programmable Money<\u002Fh3><p>How embedded finance, stablecoins, tokenisation and next-generation payment infrastructure are reshaping the movement of money.<\u002Fp><\u002Fdiv><\u002Fli>\n        <li class=\"theme-row\"><span class=\"num\">03<\u002Fspan><div><h3 class=\"theme-title\">AI, Wealth &amp; The Reinvention of Banking<\u002Fh3><p>Exploring whether AI will transform — or replace — traditional banking, wealth management and private banking models.<\u002Fp><\u002Fdiv><\u002Fli>\n        <li class=\"theme-row\"><span class=\"num\">04<\u002Fspan><div><h3 class=\"theme-title\">Trust, Infrastructure &amp; Institutional Resilience<\u002Fh3><p>The operational backbone behind modern finance: custody, safeguarding, operational resilience, cybersecurity and scalable infrastructure.<\u002Fp><\u002Fdiv><\u002Fli>\n        <li class=\"theme-row\"><span class=\"num\">05<\u002Fspan><div><h3 class=\"theme-title\">The New Financial Ecosystem<\u002Fh3><p>How banks, fintechs, family offices, digital asset firms, investors and technology leaders are converging to build the next generation of financial services.<\u002Fp><\u002Fdiv><\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n\n    <div class=\"attendee-block\">\n      <div class=\"attendee-grid\">\n        <div>\n          <span class=\"eyebrow on-dark\">Who Should Attend<\u002Fspan>\n          <h3 class=\"h2\" style=\"font-size:clamp(28px,3vw,40px); margin-bottom:14px;\">A room of peers.<\u002Fh3>\n          <p class=\"lede on-dark\">RegSymp is designed for the people who actually own the regulatory outcomes inside major financial institutions.<\u002Fp>\n          <p class=\"role-list\"><em>CEOs, Founders, CROs, COOs, Chief Compliance Officers, MLROs, General Counsel, Heads of Custody, Heads of Operational Resilience, Internal Audit Partners, Regulatory Advisors and Big 4 Partners.<\u002Fem><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================= SPEAKERS ============================= -->\n<section class=\"section light\" id=\"speakers\" data-screen-label=\"05 Speakers\">\n  <div class=\"container reveal\">\n    <div class=\"section-head\">\n      <span class=\"eyebrow\">Practitioner-First. No Vendor Presentations on the Main Stage.<\u002Fspan>\n      <h2 class=\"h2\">Confirmed Speakers.<\u002Fh2>\n      <p class=\"lede\">RegSymp's speaker faculty is drawn exclusively from sitting Heads of Function at major international financial institutions, the regulators who oversee them, and the senior advisors closest to the work. Every speaker is in the room for the full two days.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================= AGENDA ============================= -->\n<section class=\"section dark-deep\" id=\"agenda\" data-screen-label=\"06 Agenda\">\n  <div class=\"container reveal\">\n    <div class=\"section-head\">\n      <span class=\"eyebrow on-dark\">Two Days. Five Themes. Practical Outputs.<\u002Fspan>\n      <h2 class=\"h2\">Programme.<\u002Fh2>\n      <p class=\"lede on-dark\">Every session is timed, moderated and built to land a tangible takeaway. The full programme is finalised four weeks out from the event.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"tabs\" role=\"tablist\" aria-label=\"Programme tabs\">\n      <button class=\"tab active\" role=\"tab\" data-tab=\"day1\" aria-selected=\"true\">Day 1<\u002Fbutton>\n      <button class=\"tab\" role=\"tab\" data-tab=\"day2\" aria-selected=\"false\">Day 2<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div class=\"tab-panel active\" id=\"tab-day1\" role=\"tabpanel\">\n      <div class=\"agenda-row break\"><div class=\"time\">08:00<\u002Fdiv><div><div class=\"title\">Mediterranean Executive Breakfast &amp; Registration<\u002Fdiv><\u002Fdiv><div class=\"spk-meta\"><span class=\"badge\">Lounge<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"agenda-row\"><div class=\"time\">09:00<\u002Fdiv><div><div class=\"title\">The Future of European Finance<\u002Fdiv><div class=\"format\">Can Europe remain globally competitive across banking, payments, AI and digital assets?<\u002Fdiv><\u002Fdiv><div class=\"spk-meta\"><span class=\"badge\">Opening Leadership Discussion<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"agenda-row\"><div class=\"time\">09:30<\u002Fdiv><div><div class=\"title\">Payments, Stablecoins &amp; Programmable Money<\u002Fdiv><div class=\"format\">How embedded finance, stablecoins and next-generation payment infrastructure are reshaping the movement of money.<\u002Fdiv><\u002Fdiv><div class=\"spk-meta\"><span class=\"badge\">Flagship Payments Debate<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"agenda-row\"><div class=\"time\">10:15<\u002Fdiv><div><div class=\"title\">The New Financial Ecosystem<\u002Fdiv><div class=\"format\">How banks, fintechs, digital asset firms and infrastructure providers are converging to build the next generation of financial services.<\u002Fdiv><\u002Fdiv><div class=\"spk-meta\"><span class=\"badge\">Executive Panel<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"agenda-row break\"><div class=\"time\">11:00<\u002Fdiv><div><div class=\"title\">Mediterranean Coffee Break<\u002Fdiv><\u002Fdiv><div class=\"spk-meta\"><span class=\"badge\">Lounge<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"agenda-row\"><div class=\"time\">11:30<\u002Fdiv><div><div class=\"title\">AI, Wealth &amp; The Reinvention of Banking<\u002Fdiv><div class=\"format\">Can traditional banking survive — and evolve — in the AI era?<\u002Fdiv><\u002Fdiv><div class=\"spk-meta\"><span class=\"badge\">Banking Innovation Debate<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"agenda-row\"><div class=\"time\">12:15<\u002Fdiv><div><div class=\"title\">The Future Financial Consumer<\u002Fdiv><div class=\"format\">How AI, digital experiences and changing customer expectations are redefining financial services.<\u002Fdiv><\u002Fdiv><div class=\"spk-meta\"><span class=\"badge\">Future Consumer Finance Panel<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"agenda-row break\"><div class=\"time\">13:00<\u002Fdiv><div><div class=\"title\">Executive Networking Lunch<\u002Fdiv><\u002Fdiv><div class=\"spk-meta\"><span class=\"badge\">Lounge<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"agenda-row\"><div class=\"time\">14:15<\u002Fdiv><div><div class=\"title\">AI, Wealth &amp; The Reinvention of Banking<\u002Fdiv><div class=\"format\">The future of private banking, wealth management and family office ecosystems.<\u002Fdiv><\u002Fdiv><div class=\"spk-meta\"><span class=\"badge\">Wealth &amp; Private Banking Flagship<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"agenda-row\"><div class=\"time\">15:00<\u002Fdiv><div><div class=\"title\">Trust, Infrastructure &amp; Institutional Resilience<\u002Fdiv><div class=\"format\">Custody, safeguarding, operational resilience and the infrastructure behind modern finance.<\u002Fdiv><\u002Fdiv><div class=\"spk-meta\"><span class=\"badge\">Infrastructure Leadership Panel<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"agenda-row break\"><div class=\"time\">15:45<\u002Fdiv><div><div class=\"title\">Networking Break<\u002Fdiv><\u002Fdiv><div class=\"spk-meta\"><span class=\"badge\">Lounge<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"agenda-row\"><div class=\"time\">16:15<\u002Fdiv><div><div class=\"title\">Can Traditional Finance &amp; Web3 Truly Converge?<\u002Fdiv><\u002Fdiv><div class=\"spk-meta\"><span class=\"badge\">Executive Debate<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"agenda-row\"><div class=\"time\">17:00<\u002Fdiv><div><div class=\"title\">Closing Leadership Reflections &amp; Networking<\u002Fdiv><\u002Fdiv><div class=\"spk-meta\"><span class=\"badge\">Chair<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"agenda-row\"><div class=\"time\">19:30<\u002Fdiv><div><div class=\"title\">Exclusive Mediterranean Executive Dinner<\u002Fdiv><div class=\"format\">By invitation. Onwards from 19:30.<\u002Fdiv><\u002Fdiv><div class=\"spk-meta\"><span class=\"badge\">Private Dinner<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"tab-panel\" id=\"tab-day2\" role=\"tabpanel\">\n      <div class=\"agenda-row break\"><div class=\"time\">08:30<\u002Fdiv><div><div class=\"title\">Women Transforming Financial Services Breakfast<\u002Fdiv><\u002Fdiv><div class=\"spk-meta\"><span class=\"badge\">Lounge<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"agenda-row\"><div class=\"time\">09:30<\u002Fdiv><div><div class=\"title\">AI, Wealth &amp; The Reinvention of Banking<\u002Fdiv><div class=\"format\">Will AI transform — or replace — traditional banking and wealth management models?<\u002Fdiv><\u002Fdiv><div class=\"spk-meta\"><span class=\"badge\">Executive AI Debate<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"agenda-row\"><div class=\"time\">10:15<\u002Fdiv><div><div class=\"title\">Trust, Infrastructure &amp; Institutional Resilience<\u002Fdiv><div class=\"format\">Building resilient, scalable and trusted financial institutions.<\u002Fdiv><\u002Fdiv><div class=\"spk-meta\"><span class=\"badge\">Leadership Discussion<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"agenda-row break\"><div class=\"time\">11:00<\u002Fdiv><div><div class=\"title\">Coffee Break<\u002Fdiv><\u002Fdiv><div class=\"spk-meta\"><span class=\"badge\">Lounge<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"agenda-row\"><div class=\"time\">11:30<\u002Fdiv><div><div class=\"title\">The New Financial Ecosystem<\u002Fdiv><div class=\"format\">The future of family offices, institutional digital finance and alternative investments.<\u002Fdiv><\u002Fdiv><div class=\"spk-meta\"><span class=\"badge\">Future Wealth &amp; Investment Panel<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"agenda-row\"><div class=\"time\">12:15<\u002Fdiv><div><div class=\"title\">Payments, Stablecoins &amp; Programmable Money<\u002Fdiv><div class=\"format\">Will banks lead the future of payments, or will infrastructure providers and fintechs take the lead?<\u002Fdiv><\u002Fdiv><div class=\"spk-meta\"><span class=\"badge\">Payments &amp; Banking Panel<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"agenda-row break\"><div class=\"time\">13:00<\u002Fdiv><div><div class=\"title\">Executive Lunch &amp; Investor Networking<\u002Fdiv><\u002Fdiv><div class=\"spk-meta\"><span class=\"badge\">Lounge<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"agenda-row\"><div class=\"time\">14:15<\u002Fdiv><div><div class=\"title\">The Future of European Finance<\u002Fdiv><div class=\"format\">How Europe can compete globally in AI, digital finance and financial infrastructure.<\u002Fdiv><\u002Fdiv><div class=\"spk-meta\"><span class=\"badge\">Innovation Leadership Panel<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"agenda-row\"><div class=\"time\">15:00<\u002Fdiv><div><div class=\"title\">Trust, Infrastructure &amp; Institutional Resilience<\u002Fdiv><div class=\"format\">Operational resilience, cybersecurity, third-party risk and scalable infrastructure.<\u002Fdiv><\u002Fdiv><div class=\"spk-meta\"><span class=\"badge\">Infrastructure &amp; Operations Session<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"agenda-row break\"><div class=\"time\">15:45<\u002Fdiv><div><div class=\"title\">Networking Break<\u002Fdiv><\u002Fdiv><div class=\"spk-meta\"><span class=\"badge\">Lounge<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"agenda-row\"><div class=\"time\">16:15<\u002Fdiv><div><div class=\"title\">The New Financial Ecosystem<\u002Fdiv><div class=\"format\">What the next decade of financial services could look like across banking, fintech, AI and digital assets.<\u002Fdiv><\u002Fdiv><div class=\"spk-meta\"><span class=\"badge\">Closing Leadership Session<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"agenda-row\"><div class=\"time\">17:00<\u002Fdiv><div><div class=\"title\">Closing Mediterranean Networking Reception<\u002Fdiv><\u002Fdiv><div class=\"spk-meta\"><span class=\"badge\">Reception<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================= THE THIRTY-THREE ============================= -->\n<section class=\"section dark\" id=\"dinner\" data-screen-label=\"07 Thirty-Three\">\n  <div class=\"container reveal\">\n    <div class=\"thirty-three\">\n      <div class=\"tt-mark\">\n        <span class=\"tt-roman\">XXXIII<\u002Fspan>\n        <span class=\"tt-rule\"><\u002Fspan>\n        <span class=\"tt-label\">The Thirty-Three<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"tt-body\">\n        <h2 class=\"h2\">A privately convened dinner.<br>Thirty-three guests. Chatham House rules.<\u002Fh2>\n        <p>The Thirty-Three is the most intimate event of the RegSymp calendar — a seated dinner capped at thirty-three guests, curated by the programme chairs to bring senior delegates, regulators, and partners into the same room without a stage between them.<\u002Fp>\n        <p>Tables are pre-assigned to maximise cross-function exposure. Every course arrives with a structured prompt. Every conversation has a chair. Nothing is recorded. Nothing is pitched.<\u002Fp>\n        <dl class=\"dinner-spec\">\n          <div><dt>Format<\u002Fdt><dd>Seated dinner · pre-assigned tables · structured prompts per course<\u002Fdd><\u002Fdiv>\n          <div><dt>Capacity<\u002Fdt><dd>33 guests<\u002Fdd><\u002Fdiv>\n          <div><dt>Rules<\u002Fdt><dd>Chatham House<\u002Fdd><\u002Fdiv>\n        <\u002Fdl>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================= SPONSORS ============================= -->\n<section class=\"section light\" id=\"sponsors\" data-screen-label=\"08 Sponsors\">\n  <div class=\"container reveal\">\n    <div class=\"section-head\">\n      <span class=\"eyebrow\">Sponsorship &amp; Partnership<\u002Fspan>\n      <h2 class=\"h2\">A seat in the room that matters.<\u002Fh2>\n      <p class=\"lede\">A small number of carefully selected partners support RegSymp each year. There are no exhibition booths and no stage time for product pitches. What sponsors get is real access to a room of decision-makers who otherwise do not assemble in one place.<\u002Fp>\n    <\u002Fdiv>\n\n\n    <div class=\"sponsor-cta\">\n      <div>\n        <h3 class=\"h3\">Let's talk sponsorship.<\u002Fh3>\n        <p>Strategic and Programme partner inventory is limited and confirmed on a first-discussion basis. We'd rather have one substantive conversation than send a deck. Speak to the Delegate Desk at <a href=\"mailto:info@regsymp.com\" style=\"color:var(--gold); border-bottom:1px solid currentColor; padding-bottom:1px;\">info@regsymp.com<\u002Fa> to arrange.<\u002Fp>\n      <\u002Fdiv>\n      <a href=\"mailto:info@regsymp.com\" class=\"btn btn-primary\">Let's Talk Sponsorship <span class=\"arrow\">→<\u002Fspan><\u002Fa>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================= COUNTDOWN STRIP (removed) ============================= -->\n\n<!-- ============================= TICKETS (removed) ============================= -->\n\n<!-- ============================= MEDIA & PRESS (removed) ============================= -->\n\n<\u002Fmain>\n\n<!-- ============================= ABOUT THE ORGANISER (removed) ============================= -->\n\n<!-- ============================= FOOTER ============================= -->\n<footer class=\"footer\" data-screen-label=\"12 Footer\">\n  <div class=\"container\">\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <a href=\"#home\" class=\"brand brand-hex\" style=\"color:var(--white); display:inline-flex; align-items:center; gap:0;\">\n          <img src=\"683a7112-d9d8-4925-bd62-6ef034dd7c2a\" alt=\"\" style=\"height:54px; width:auto; display:block; filter:brightness(0) invert(1); margin-right:-6px;\">\n          <span class=\"brand-wordmark\" style=\"display:inline-block; line-height:0;\"><img src=\"ae3620a8-b7c1-4720-b9eb-d9f52eed9c0f\" alt=\"RegSymp\" style=\"height:30px; width:auto; display:block;\"><\u002Fspan>\n        <\u002Fa>\n        <p>The senior, practitioner-led regulatory and compliance symposium series for financial services leaders.<\u002Fp>\n        <div class=\"footer-social\">\n          <a href=\"#\" aria-label=\"LinkedIn\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.95v5.66H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.59 0 4.26 2.36 4.26 5.43v6.31zM5.34 7.43a2.06 2.06 0 110-4.12 2.06 2.06 0 010 4.12zM7.12 20.45H3.56V9h3.56v11.45z\"><\u002Fpath><\u002Fsvg><\u002Fa>\n          <a href=\"#\" aria-label=\"X / Twitter\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z\"><\u002Fpath><\u002Fsvg><\u002Fa>\n          <a href=\"mailto:info@regsymp.com\" aria-label=\"Email\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"><\u002Frect><path d=\"M3 7l9 6 9-6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <nav class=\"footer-nav\" aria-label=\"Footer\">\n        <div>\n          <h5>Programme<\u002Fh5>\n          <ul>\n            <li><a href=\"#about\">About<\u002Fa><\u002Fli>\n            <li><a href=\"#why\">Why Attend<\u002Fa><\u002Fli>\n            <li><a href=\"#speakers\">Speakers<\u002Fa><\u002Fli>\n            <li><a href=\"#agenda\">Agenda<\u002Fa><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div>\n          <h5>Attend<\u002Fh5>\n          <ul>\n            <li><a href=\"#venue\">Venue<\u002Fa><\u002Fli>\n            <li><a href=\"#dinner\">The Thirty-Three<\u002Fa><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div>\n          <h5>Partner<\u002Fh5>\n          <ul>\n            <li><a href=\"#sponsors\">Sponsorship<\u002Fa><\u002Fli>\n            <li><a href=\"mailto:info@regsymp.com\">Speaker Submissions<\u002Fa><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"footer-email\">\n          <h5>Contact<\u002Fh5>\n          <ul>\n            <li><span class=\"em-label\">General<\u002Fspan><a href=\"mailto:info@regsymp.com\">info@regsymp.com<\u002Fa><\u002Fli>\n            <li><span class=\"em-label\">LinkedIn<\u002Fspan><a href=\"#\">linkedin.com/regsymp<\u002Fa><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fnav>\n    <\u002Fdiv>\n\n    <div class=\"footer-bot\">\n      <div class=\"links\"><a href=\"legal.html\">Legal<\u002Fa><\u002Fdiv>\n      <div>© 2026 RegSymp. All rights reserved.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n(function(){\n  // Nav scroll state\n  const nav = document.getElementById('nav');\n  const onScroll = () => { nav.classList.toggle('scrolled', window.scrollY > 60); };\n  document.addEventListener('scroll', onScroll, {passive: true}); onScroll();\n\n  // Mobile drawer\n  const burger = document.getElementById('burger');\n  const drawer = document.getElementById('drawer');\n  const drawerClose = document.getElementById('drawerClose');\n  function setDrawer(open){\n    drawer.classList.toggle('open', open);\n    drawer.setAttribute('aria-hidden', String(!open));\n    document.body.style.overflow = open ? 'hidden' : '';\n    if (open) {\n      const firstLink = document.querySelector('.drawer-links a');\n      if (firstLink) firstLink.focus();\n    } else {\n      document.getElementById('burger').focus();\n    }\n  }\n  burger.addEventListener('click', () => setDrawer(true));\n  drawerClose.addEventListener('click', () => setDrawer(false));\n  drawer.querySelectorAll('a').forEach(a => a.addEventListener('click', () => setDrawer(false)));\n\n  // City selector\n  const cityPick = document.getElementById('cityPick');\n  const cityBtn = document.getElementById('cityPickBtn');\n  cityBtn.addEventListener('click', (e) => {\n    e.stopPropagation();\n    const open = cityPick.classList.toggle('open');\n    cityBtn.setAttribute('aria-expanded', String(open));\n  });\n  document.addEventListener('click', () => { cityPick.classList.remove('open'); cityBtn.setAttribute('aria-expanded', 'false'); });\n\n  // Agenda tabs\n  const tabs = document.querySelectorAll('.tab');\n  tabs.forEach(t => t.addEventListener('click', () => {\n    tabs.forEach(x => { x.classList.remove('active'); x.setAttribute('aria-selected', 'false'); });\n    t.classList.add('active'); t.setAttribute('aria-selected', 'true');\n    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));\n    document.getElementById('tab-' + t.dataset.tab).classList.add('active');\n  }));\n\n  // Countdown removed\n\n  // Section reveal on scroll\n  const io = new IntersectionObserver((entries) => {\n    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });\n  }, { threshold: 0.08, rootMargin: '0px 0px -80px 0px' });\n  document.querySelectorAll('.reveal').forEach(el => io.observe(el));\n\n  // Active nav state on scroll\n  const sections = ['about','why','speakers','agenda','sponsors','venue'];\n  const navLinks = document.querySelectorAll('.nav-links a');\n  const spy = new IntersectionObserver((entries) => {\n    entries.forEach(e => {\n      if (e.isIntersecting) {\n        const id = e.target.id;\n        navLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + id));\n      }\n    });\n  }, { threshold: 0.3 });\n  sections.forEach(id => { const el = document.getElementById(id); if (el) spy.observe(el); });\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
